# नियति ज्योतिष कार्यालय — kundli/ फ़ोल्डर को GitHub Pages पर प्रकाशित करता है
name: Deploy Kundli site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["kundli/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kundli
      - id: deployment
        uses: actions/deploy-pages@v4
